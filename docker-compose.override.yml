services:
  caddy:
    ports:
      - "443:443"
    volumes:
      - ./caddy_certs:/etc/caddy/certs:ro

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      # Base docker-compose.yml hardcodes this to http://minio:9000 for the
      # api service only (worker/executor/agent-* all read it from .env) --
      # override it here so api also respects TRACECAT__BLOB_STORAGE_ENDPOINT.
      TRACECAT__BLOB_STORAGE_ENDPOINT: ${TRACECAT__BLOB_STORAGE_ENDPOINT:-http://minio:9000}
    volumes:
      - ./certs/dgk_ca.pem:/tmp/dgk_ca.pem:ro
      - ./caddy_certs/server.crt:/tmp/minio_ca.pem:ro
      - ./ca_wrapper.sh:/ca_wrapper.sh:ro
      - ./defaults.py:/app/tracecat/tiers/defaults.py:ro
      - ./defaults.py:/app/.venv/lib/python3.12/site-packages/tracecat/tiers/defaults.py:ro
    entrypoint: ["/bin/bash", "/ca_wrapper.sh"]
    command: ["python3", "-m", "uvicorn", "tracecat.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

  worker:
    volumes:
      - ./caddy_certs/server.crt:/tmp/minio_ca.pem:ro
      - ./ca_wrapper_minio_only.sh:/ca_wrapper_minio_only.sh:ro
      - ./defaults.py:/app/tracecat/tiers/defaults.py:ro
      - ./defaults.py:/app/.venv/lib/python3.12/site-packages/tracecat/tiers/defaults.py:ro
    entrypoint: ["/bin/bash", "/ca_wrapper_minio_only.sh"]

  executor:
    volumes:
      - ./caddy_certs/server.crt:/tmp/minio_ca.pem:ro
      - ./ca_wrapper_minio_only.sh:/ca_wrapper_minio_only.sh:ro
      - ./defaults.py:/app/tracecat/tiers/defaults.py:ro
      - ./defaults.py:/app/.venv/lib/python3.12/site-packages/tracecat/tiers/defaults.py:ro
    entrypoint: ["/bin/bash", "/ca_wrapper_minio_only.sh"]

  agent-executor:
    volumes:
      - ./certs/dgk_ca.pem:/tmp/dgk_ca.pem:ro
      - ./caddy_certs/server.crt:/tmp/minio_ca.pem:ro
      - ./ca_wrapper.sh:/ca_wrapper.sh:ro
      - ./defaults.py:/app/tracecat/tiers/defaults.py:ro
      - ./defaults.py:/app/.venv/lib/python3.12/site-packages/tracecat/tiers/defaults.py:ro
      - ./tracecat/agent/sandbox/llm_proxy.py:/app/tracecat/agent/sandbox/llm_proxy.py:ro
    entrypoint: ["/bin/bash", "/ca_wrapper.sh"]

  agent-worker:
    volumes:
      - ./certs/dgk_ca.pem:/tmp/dgk_ca.pem:ro
      - ./caddy_certs/server.crt:/tmp/minio_ca.pem:ro
      - ./ca_wrapper.sh:/ca_wrapper.sh:ro
      - ./defaults.py:/app/tracecat/tiers/defaults.py:ro
      - ./defaults.py:/app/.venv/lib/python3.12/site-packages/tracecat/tiers/defaults.py:ro
      - ./tracecat/agent/sandbox/llm_proxy.py:/app/tracecat/agent/sandbox/llm_proxy.py:ro
    entrypoint: ["/bin/bash", "/ca_wrapper.sh"]

  litellm:
    environment:
      GROQ_API_KEY: "${GROQ_API_KEY}"
    volumes:
      - ./certs/dgk_ca.pem:/tmp/dgk_ca.pem:ro
      - ./caddy_certs/server.crt:/tmp/minio_ca.pem:ro
      - ./ca_wrapper.sh:/ca_wrapper.sh:ro
      - ./tracecat/agent/litellm_config.yaml:/app/tracecat/agent/litellm_config.yaml:ro
      - ./tracecat/agent/gateway.py:/app/tracecat/agent/gateway.py:ro
    entrypoint: ["/bin/bash", "/ca_wrapper.sh"]

  minio:
    volumes:
      - ./caddy_certs/server.crt:/root/.minio/certs/public.crt:ro
      - ./caddy_certs/server.key:/root/.minio/certs/private.key:ro
    healthcheck:
      # MinIO-nun oz "local" alias-i daxili olaraq HEMISE http://localhost:9000
      # kimi qurulur (bizim TLS deyisikliyimizden xebersiz), TLS aktiv olanda
      # "Client sent an HTTP request to an HTTPS server" xetasi verir. Ona gore
      # her yoxlamadan evvel alias-i https+insecure (self-signed sert) ile
      # yenidan qururuq.
      test: ["CMD-SHELL", "mc alias set local https://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD --insecure && mc ready local --insecure"]
      interval: 5s
      timeout: 5s
      retries: 5

  soc-mcp:
    build: ./soc-mcp
    environment:
      SPLUNK_BASE_URL: "${SPLUNK_BASE_URL}"
      SPLUNK_TOKEN: "${SPLUNK_TOKEN}"
      SPLUNK_VERIFY_SSL: "${SPLUNK_VERIFY_SSL}"
      CORTEX_API_URL: "${CORTEX_API_URL}"
      CORTEX_API_KEY: "${CORTEX_API_KEY}"
      CORTEX_API_KEY_ID: "${CORTEX_API_KEY_ID}"
      TRELLIX_EPO_URL: "${TRELLIX_EPO_URL}"
      TRELLIX_USER: "${TRELLIX_USER}"
      TRELLIX_PASS: "${TRELLIX_PASS}"
      CHECKPOINT_MGMT_URL: "${CHECKPOINT_MGMT_URL}"
      CHECKPOINT_USER: "${CHECKPOINT_USER}"
      CHECKPOINT_PASS: "${CHECKPOINT_PASS}"
      PMG_URL: "${PMG_URL}"
      PMG_USER: "${PMG_USER}"
      PMG_PASS: "${PMG_PASS}"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8100"
    ports:
      - "8100:8100"
    networks:
      - core
    restart: unless-stopped

  soc-mcp-actions:
    build: ./soc-mcp
    command: ["python", "server_actions.py"]
    environment:
      CORTEX_API_URL: "${CORTEX_API_URL}"
      CORTEX_API_KEY: "${CORTEX_API_KEY}"
      CORTEX_API_KEY_ID: "${CORTEX_API_KEY_ID}"
      TRELLIX_EPO_URL: "${TRELLIX_EPO_URL}"
      TRELLIX_USER: "${TRELLIX_USER}"
      TRELLIX_PASS: "${TRELLIX_PASS}"
      PMG_URL: "${PMG_URL}"
      PMG_USER: "${PMG_USER}"
      PMG_PASS: "${PMG_PASS}"
      MCP_HOST: "0.0.0.0"
      MCP_ACTIONS_PORT: "8101"
    ports:
      - "8101:8101"
    networks:
      - core
    restart: unless-stopped
